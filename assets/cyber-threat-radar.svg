<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="t d">
<title id="t">Cyber threat radar</title><desc id="d">Compact animated cyberpunk world threat radar with pulsing threat nodes, scanning radar and telemetry readout. Decorative visualization of public threat intelligence.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#030711"/></linearGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#00eaff" stop-opacity="0"/><stop offset=".5" stop-color="#00eaff"/><stop offset="1" stop-color="#ff31d2" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#12334a" stroke-width=".65"/></pattern>
 <clipPath id="clip"><rect x="18" y="48" width="650" height="155" rx="5"/></clipPath>
</defs>
<rect width="1000" height="230" rx="12" fill="url(#bg)" stroke="#0b8298" stroke-opacity=".65"/>
<rect x="1" y="1" width="998" height="228" rx="11" fill="url(#grid)" opacity=".45"/>
<path d="M18 38H982" stroke="#00eaff" stroke-opacity=".35"/>
