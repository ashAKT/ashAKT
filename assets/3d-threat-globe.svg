 <circle cx="566" cy="111" r="4" fill="#00efff"/><circle cx="566" cy="111" r="10" fill="none" stroke="#00efff"><animate attributeName="r" values="6;17;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.4s" repeatCount="indefinite"/></circle>
