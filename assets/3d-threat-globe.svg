<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">3D cyber threat globe</title><desc id="desc">Stylized animated three-dimensional neon globe with glowing threat hotspots and illustrative connection arcs.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#102b45"/><stop offset="1" stop-color="#030711"/></radialGradient>
 <radialGradient id="earth" cx="35%" cy="28%"><stop stop-color="#12405a"/><stop offset=".58" stop-color="#082238"/><stop offset="1" stop-color="#020914"/></radialGradient>
 <linearGradient id="arc"><stop stop-color="#00efff" stop-opacity="0"/><stop offset=".5" stop-color="#00efff"/><stop offset="1" stop-color="#ff36d7" stop-opacity=".1"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="sphere"><circle cx="500" cy="132" r="105"/></clipPath>
</defs>
<rect width="1000" height="260" rx="12" fill="url(#space)" stroke="#00dff0" stroke-opacity=".45"/>
