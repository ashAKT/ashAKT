<text x="28" y="34" fill="#00efff" font-family="monospace" font-size="12" letter-spacing="2">ashAKT // 3D GLOBAL THREAT RADAR</text>
<text x="972" y="34" text-anchor="end" fill="#ff67dc" font-family="monospace" font-size="10" letter-spacing="1.5">OPEN-SOURCE THREAT INTELLIGENCE</text>
<circle cx="500" cy="132" r="117" fill="none" stroke="#00efff" stroke-opacity=".16" stroke-width="1"/>
<circle cx="500" cy="132" r="105" fill="url(#earth)" stroke="#00cce8" stroke-opacity=".7" stroke-width="1.5"/>
<g clip-path="url(#sphere)" fill="none" stroke="#00bcd4" stroke-opacity=".33">
 <ellipse cx="500" cy="132" rx="104" ry="35"/><ellipse cx="500" cy="132" rx="104" ry="70"/>
 <ellipse cx="500" cy="132" rx="42" ry="104"/><ellipse cx="500" cy="132" rx="78" ry="104"/>
 <path d="M390 132H610M500 25V239" stroke-dasharray="3 5"/>
