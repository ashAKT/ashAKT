</g>
<g fill="none" stroke="url(#arc)" stroke-width="2" filter="url(#glow)">
 <path d="M420 115Q500 12 566 111"><animate attributeName="stroke-dasharray" values="0 300;150 150;300 0" dur="3.5s" repeatCount="indefinite"/></path>
