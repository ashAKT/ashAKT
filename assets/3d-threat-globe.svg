<text x="760" y="92" fill="#8298b2" font-size="9" letter-spacing="1.5">VISUALIZATION</text><text x="760" y="116" fill="#9dffb0" font-size="13">3D GLOBE</text><text x="760" y="137" fill="#ff67dc" font-size="10">PULSING HOTSPOTS</text><text x="760" y="155" fill="#00efff" font-size="10">ILLUSTRATIVE ARCS</text><path d="M760 169H940" stroke="#00efff" stroke-opacity=".5"/><text x="760" y="188" fill="#8298b2" font-size="9">OPEN-SOURCE INTEL</text></g>
