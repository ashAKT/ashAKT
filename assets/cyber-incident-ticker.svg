<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Animated cybersecurity incident archive">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101d2e"/></linearGradient></defs>
<rect width="1100" height="360" rx="18" fill="url(#bg)"/><rect x="20" y="20" width="1060" height="320" rx="12" fill="none" stroke="#28445b"/>
<circle cx="48" cy="48" r="5" fill="#43d9a3"/><text x="66" y="53" class="top">THREAT INTELLIGENCE  /  HISTORICAL CASE FILES</text><path d="M54 310H1046" stroke="#28445b"/><text x="54" y="333" class="foot">SECURITY INCIDENTS • WHAT HAPPENED • OPERATIONAL IMPACT</text><text x="1046" y="333" text-anchor="end" class="foot">AUTO-ROTATING</text>
<style>.top{font:600 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#8da8bf}.eyebrow{font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#43d9a3}.headline{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#f1f6fb}.label{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#58b9e8}.body{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#c5d3df}.foot{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.3px;fill:#7892a8}</style>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="0s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2023  /  INCIDENT ARCHIVE  /  01 OF 12</text><text x="54" y="137" class="headline">23andMe credential stuffing</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">Reused passwords enabled access to user accounts and related profile data.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Genetic and profile information was exposed, creating unusually sensitive privacy risks.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="1s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2021  /  INCIDENT ARCHIVE  /  02 OF 12</text><text x="54" y="137" class="headline">Log4Shell</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">A critical Log4j flaw enabled remote code execution across exposed Java applications.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Widespread exposure triggered urgent global patching and incident-response efforts.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="2s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2025  /  INCIDENT ARCHIVE  /  03 OF 12</text><text x="54" y="137" class="headline">Oracle Cloud credential exposure claims</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">Reports of stolen credentials and customer data triggered investigations and disputed claims.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Customers reviewed credential risk; the claimed scope and impact remained contested.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="3s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2012  /  INCIDENT ARCHIVE  /  04 OF 12</text><text x="54" y="137" class="headline">Shamoon</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">A destructive wiper erased data on tens of thousands of computers at Saudi Aramco.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Large numbers of computers were rendered unusable, disrupting operations and recovery.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="4s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2018  /  INCIDENT ARCHIVE  /  05 OF 12</text><text x="54" y="137" class="headline">Exactis data exposure</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">A publicly accessible database exposed personal information on hundreds of millions of people.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Exposed personal data increased risks of profiling, phishing and identity fraud.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="5s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2019  /  INCIDENT ARCHIVE  /  06 OF 12</text><text x="54" y="137" class="headline">Citrix ADC exploitation</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">Attackers exploited gateway flaws to gain access to enterprise networks.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Sensitive systems and data were exposed to further compromise.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="6s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2023  /  INCIDENT ARCHIVE  /  07 OF 12</text><text x="54" y="137" class="headline">3CX supply-chain attack</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">A compromised software build chain distributed malware through a trusted business application.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Trusted software updates created downstream compromise and espionage risks.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="7s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2024  /  INCIDENT ARCHIVE  /  08 OF 12</text><text x="54" y="137" class="headline">AnyDesk compromise</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">Attackers accessed parts of the production systems and code-signing-related environment.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Credential resets and heightened software-supply-chain risk followed.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="8s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2017  /  INCIDENT ARCHIVE  /  09 OF 12</text><text x="54" y="137" class="headline">NotPetya</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">A destructive wiper spread through a compromised software update.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Global companies suffered destructive outages and billions of dollars in losses.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="9s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2017  /  INCIDENT ARCHIVE  /  10 OF 12</text><text x="54" y="137" class="headline">WannaCry</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">Ransomware used EternalBlue to spread rapidly across more than 150 countries.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Hundreds of thousands of systems were affected, disrupting hospitals and businesses.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="10s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2021  /  INCIDENT ARCHIVE  /  11 OF 12</text><text x="54" y="137" class="headline">Accellion FTA</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">Zero-day exploitation enabled data theft from organizations using a legacy file-transfer appliance.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Sensitive files were stolen, leading to extortion, privacy and legal consequences.</text></g>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.075;0.085;1" dur="12s" begin="11s" repeatCount="indefinite"/><text x="54" y="82" class="eyebrow">2024  /  INCIDENT ARCHIVE  /  12 OF 12</text><text x="54" y="137" class="headline">Ticketmaster / Live Nation data theft</text><text x="54" y="190" class="label">WHAT HAPPENED</text><text x="54" y="220" class="body">A cloud-hosted dataset was advertised for sale after unauthorized-access claims.</text><text x="54" y="263" class="label">IMPACT</text><text x="54" y="293" class="body">Customer-related data exposure raised privacy and account-security concerns.</text></g>
</svg>