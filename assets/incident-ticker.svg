 <g clip-path="url(#reveal0)" font-family="Fira Code,Consolas,monospace" text-anchor="start">
  <text x="42" y="48" fill="#00f7a5" font-size="20" font-weight="600">2017 / NOTPETYA</text>
  <text x="42" y="88" fill="#d7e5e9" font-size="14"><tspan x="42">A compromised M.E.Doc software update delivered destructive malware.</tspan><tspan x="42" dy="23">It spread through networks using SMB exploits and stolen credentials,</tspan><tspan x="42" dy="23">disrupting global businesses and causing billions of dollars in damage.</tspan></text>
  <text x="42" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
 </g>
</g>
<clipPath id="reveal1"><rect x="30" y="0" width="0" height="190"><animate attributeName="width" values="0;20;41;61;82;102;123;143;163;184;204;225;245;266;286;307;327;347;368;388;409;429;450;470;490;511;531;552;572;593;613;633;654;674;695;715;736;756;777;797;817;838;858;879;899;920;940;940" keyTimes="0.00000;0.01696;0.03391;0.05087;0.06783;0.08478;0.10174;0.11870;0.13565;0.15261;0.16957;0.18652;0.20348;0.22043;0.23739;0.25435;0.27130;0.28826;0.30522;0.32217;0.33913;0.35609;0.37304;0.39000;0.40696;0.42391;0.44087;0.45783;0.47478;0.49174;0.50870;0.52565;0.54261;0.55957;0.57652;0.59348;0.61043;0.62739;0.64435;0.66130;0.67826;0.69522;0.71217;0.72913;0.74609;0.76304;0.78000;1" dur="5s" begin="5s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
 <g clip-path="url(#reveal1)" font-family="Fira Code,Consolas,monospace" text-anchor="start">
  <text x="42" y="48" fill="#00f7a5" font-size="20" font-weight="600">2017 / WANNACRY</text>
  <text x="42" y="88" fill="#d7e5e9" font-size="14"><tspan x="42">Exploited Windows SMBv1 (MS17-010) using the EternalBlue exploit.</tspan><tspan x="42" dy="23">More than 200,000 computers across 150+ countries were affected,</tspan><tspan x="42" dy="23">including major disruption to the UK's National Health Service.</tspan></text>
  <text x="42" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
 </g>
</g>
