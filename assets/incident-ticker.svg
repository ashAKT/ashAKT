 <g clip-path="url(#reveal4)" font-family="Fira Code,Consolas,monospace" text-anchor="start">
  <text x="42" y="48" fill="#00f7a5" font-size="20" font-weight="600">2021 / COLONIAL PIPELINE</text>
  <text x="42" y="88" fill="#d7e5e9" font-size="14"><tspan x="42">DarkSide ransomware disrupted operations and forced a temporary</tspan><tspan x="42" dy="23">shutdown of a major US fuel pipeline, highlighting the operational</tspan><tspan x="42" dy="23">and economic impact ransomware can have on critical infrastructure.</tspan></text>
  <text x="42" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
 </g>
