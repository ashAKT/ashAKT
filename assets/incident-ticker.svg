<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
<title id="title">Animated typewriter-style cyber incident ticker</title>
<desc id="desc">Five major cybersecurity incidents, each typed onto multiple lines and shown one at a time.</desc>
<rect width="1000" height="190" rx="12" fill="#07131b" stroke="#00f7a5" stroke-opacity=".55"/>

  <clipPath id="clip0"><rect x="0" y="0" width="0" height="190"><animate attributeName="width" values="0;21;42;63;83;104;125;146;167;188;208;229;250;271;292;313;333;354;375;396;417;438;458;479;500;521;542;563;583;604;625;646;667;688;708;729;750;771;792;813;833;854;875;896;917;938;958;979;1000;1000" keyTimes="0.00000;0.00750;0.01500;0.02250;0.03000;0.03750;0.04500;0.05250;0.06000;0.06750;0.07500;0.08250;0.09000;0.09750;0.10500;0.11250;0.12000;0.12750;0.13500;0.14250;0.15000;0.15750;0.16500;0.17250;0.18000;0.18750;0.19500;0.20250;0.21000;0.21750;0.22500;0.23250;0.24000;0.24750;0.25500;0.26250;0.27000;0.27750;0.28500;0.29250;0.30000;0.30750;0.31500;0.32250;0.33000;0.33750;0.34500;0.35250;0.36000;1" dur="5s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.00;0.185;0.20;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
    <g clip-path="url(#clip0)" font-family="Fira Code,Consolas,monospace" text-anchor="middle">
      <text x="500" y="48" fill="#00f7a5" font-size="20" font-weight="600">2017 / NOTPETYA</text>
      <text x="500" y="88" fill="#d7e5e9" font-size="14"><tspan x="500">A compromised M.E.Doc software update delivered destructive malware.</tspan><tspan x="500" dy="23">It spread through networks using SMB exploits and stolen credentials,</tspan><tspan x="500" dy="23">disrupting global businesses and causing billions of dollars in damage.</tspan></text>
      <text x="500" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
    </g>
  </g>
  <clipPath id="clip1"><rect x="0" y="0" width="0" height="190"><animate attributeName="width" values="0;21;42;63;83;104;125;146;167;188;208;229;250;271;292;313;333;354;375;396;417;438;458;479;500;521;542;563;583;604;625;646;667;688;708;729;750;771;792;813;833;854;875;896;917;938;958;979;1000;1000" keyTimes="0.00000;0.00750;0.01500;0.02250;0.03000;0.03750;0.04500;0.05250;0.06000;0.06750;0.07500;0.08250;0.09000;0.09750;0.10500;0.11250;0.12000;0.12750;0.13500;0.14250;0.15000;0.15750;0.16500;0.17250;0.18000;0.18750;0.19500;0.20250;0.21000;0.21750;0.22500;0.23250;0.24000;0.24750;0.25500;0.26250;0.27000;0.27750;0.28500;0.29250;0.30000;0.30750;0.31500;0.32250;0.33000;0.33750;0.34500;0.35250;0.36000;1" dur="5s" begin="5s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.20;0.385;0.40;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
    <g clip-path="url(#clip1)" font-family="Fira Code,Consolas,monospace" text-anchor="middle">
      <text x="500" y="48" fill="#00f7a5" font-size="20" font-weight="600">2017 / WANNACRY</text>
      <text x="500" y="88" fill="#d7e5e9" font-size="14"><tspan x="500">Exploited Windows SMBv1 (MS17-010) using the EternalBlue exploit.</tspan><tspan x="500" dy="23">More than 200,000 computers across 150+ countries were affected,</tspan><tspan x="500" dy="23">including major disruption to the UK's National Health Service.</tspan></text>
      <text x="500" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
    </g>
  </g>
  <clipPath id="clip2"><rect x="0" y="0" width="0" height="190"><animate attributeName="width" values="0;21;42;63;83;104;125;146;167;188;208;229;250;271;292;313;333;354;375;396;417;438;458;479;500;521;542;563;583;604;625;646;667;688;708;729;750;771;792;813;833;854;875;896;917;938;958;979;1000;1000" keyTimes="0.00000;0.00750;0.01500;0.02250;0.03000;0.03750;0.04500;0.05250;0.06000;0.06750;0.07500;0.08250;0.09000;0.09750;0.10500;0.11250;0.12000;0.12750;0.13500;0.14250;0.15000;0.15750;0.16500;0.17250;0.18000;0.18750;0.19500;0.20250;0.21000;0.21750;0.22500;0.23250;0.24000;0.24750;0.25500;0.26250;0.27000;0.27750;0.28500;0.29250;0.30000;0.30750;0.31500;0.32250;0.33000;0.33750;0.34500;0.35250;0.36000;1" dur="5s" begin="10s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.40;0.585;0.60;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
    <g clip-path="url(#clip2)" font-family="Fira Code,Consolas,monospace" text-anchor="middle">
      <text x="500" y="48" fill="#00f7a5" font-size="20" font-weight="600">2017 / EQUIFAX</text>
      <text x="500" y="88" fill="#d7e5e9" font-size="14"><tspan x="500">Attackers exploited an unpatched Apache Struts flaw (CVE-2017-5638)</tspan><tspan x="500" dy="23">to access sensitive data. Personal information belonging to about</tspan><tspan x="500" dy="23">147 million people was exposed.</tspan></text>
      <text x="500" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
    </g>
  </g>
  <clipPath id="clip3"><rect x="0" y="0" width="0" height="190"><animate attributeName="width" values="0;21;42;63;83;104;125;146;167;188;208;229;250;271;292;313;333;354;375;396;417;438;458;479;500;521;542;563;583;604;625;646;667;688;708;729;750;771;792;813;833;854;875;896;917;938;958;979;1000;1000" keyTimes="0.00000;0.00750;0.01500;0.02250;0.03000;0.03750;0.04500;0.05250;0.06000;0.06750;0.07500;0.08250;0.09000;0.09750;0.10500;0.11250;0.12000;0.12750;0.13500;0.14250;0.15000;0.15750;0.16500;0.17250;0.18000;0.18750;0.19500;0.20250;0.21000;0.21750;0.22500;0.23250;0.24000;0.24750;0.25500;0.26250;0.27000;0.27750;0.28500;0.29250;0.30000;0.30750;0.31500;0.32250;0.33000;0.33750;0.34500;0.35250;0.36000;1" dur="5s" begin="15s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.60;0.785;0.80;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
    <g clip-path="url(#clip3)" font-family="Fira Code,Consolas,monospace" text-anchor="middle">
      <text x="500" y="48" fill="#00f7a5" font-size="20" font-weight="600">2020 / SOLARWINDS SUNBURST</text>
      <text x="500" y="88" fill="#d7e5e9" font-size="14"><tspan x="500">Attackers compromised the software build process and inserted a</tspan><tspan x="500" dy="23">backdoor into Orion updates, enabling stealthy access and espionage</tspan><tspan x="500" dy="23">across government agencies and enterprise networks.</tspan></text>
      <text x="500" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
    </g>
  </g>
  <clipPath id="clip4"><rect x="0" y="0" width="0" height="190"><animate attributeName="width" values="0;21;42;63;83;104;125;146;167;188;208;229;250;271;292;313;333;354;375;396;417;438;458;479;500;521;542;563;583;604;625;646;667;688;708;729;750;771;792;813;833;854;875;896;917;938;958;979;1000;1000" keyTimes="0.00000;0.00750;0.01500;0.02250;0.03000;0.03750;0.04500;0.05250;0.06000;0.06750;0.07500;0.08250;0.09000;0.09750;0.10500;0.11250;0.12000;0.12750;0.13500;0.14250;0.15000;0.15750;0.16500;0.17250;0.18000;0.18750;0.19500;0.20250;0.21000;0.21750;0.22500;0.23250;0.24000;0.24750;0.25500;0.26250;0.27000;0.27750;0.28500;0.29250;0.30000;0.30750;0.31500;0.32250;0.33000;0.33750;0.34500;0.35250;0.36000;1" dur="5s" begin="20s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.80;0.985;1.00;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
    <g clip-path="url(#clip4)" font-family="Fira Code,Consolas,monospace" text-anchor="middle">
      <text x="500" y="48" fill="#00f7a5" font-size="20" font-weight="600">2021 / COLONIAL PIPELINE</text>
      <text x="500" y="88" fill="#d7e5e9" font-size="14"><tspan x="500">DarkSide ransomware disrupted operations and forced a temporary</tspan><tspan x="500" dy="23">shutdown of a major US fuel pipeline, highlighting the operational</tspan><tspan x="500" dy="23">and economic impact ransomware can have on critical infrastructure.</tspan></text>
      <text x="500" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
    </g>
  </g>
</svg>