<g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="25s" repeatCount="indefinite" calcMode="discrete"/>
 <g clip-path="url(#reveal2)" font-family="Fira Code,Consolas,monospace" text-anchor="start">
  <text x="42" y="48" fill="#00f7a5" font-size="20" font-weight="600">2017 / EQUIFAX</text>
  <text x="42" y="88" fill="#d7e5e9" font-size="14"><tspan x="42">Attackers exploited an unpatched Apache Struts flaw (CVE-2017-5638)</tspan><tspan x="42" dy="23">to access sensitive data. Personal information belonging to about</tspan><tspan x="42" dy="23">147 million people was exposed.</tspan></text>
  <text x="42" y="174" fill="#00f7a5" font-size="11" letter-spacing="2">THREAT LANDSCAPE / INCIDENT BRIEF</text>
 </g>
</g>
