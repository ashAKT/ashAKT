name: Rotate cybersecurity incident brief

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-cyber-incident
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Select a random incident and refresh catalog
        run: python scripts/rotate_incident.py
      - name: Commit updated profile and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CYBER_INCIDENTS.md .github/last_incident.txt
          if git diff --cached --quiet; then
            echo "No profile change needed."
            exit 0
          fi
          git commit -m "Rotate cybersecurity incident brief"
          git push
