name: Refresh public threat intelligence snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: threat-intel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public threat intelligence
        run: python scripts/update_threat_data.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/threats.json
          if git diff --cached --quiet; then
            echo "Threat snapshot unchanged."
          else
            git commit -m "Refresh public threat intelligence snapshot"
            git push
          fi
