name: Generate animated incident ticker

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_incident_ticker.py"
      - ".github/workflows/generate-incident-ticker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate animated GIF
        run: python scripts/generate_incident_ticker.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/incident-ticker.gif
          git diff --cached --quiet || git commit -m "Generate animated multiline incident ticker"
          git push
